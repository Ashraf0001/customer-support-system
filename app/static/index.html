<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Support UI</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-600: #4338ca;
      --bg: #f7f7fb;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --ok: #059669;
      --warn: #d97706;
      --err: #b91c1c;
    }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem auto; max-width: 980px; color: var(--text); background: var(--bg); }
    h1 { margin-bottom: 1rem; }
    input, textarea, select { width: 100%; padding: .6rem .7rem; margin: .25rem 0 1rem; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    button { padding: .6rem 1rem; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { background: var(--primary-600); border-color: var(--primary-600); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin: .75rem 0; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
    .card:hover { box-shadow: 0 6px 18px rgba(17,24,39,.06); }
    .muted { color: var(--muted); font-size: .9rem; }
    .badge { display: inline-block; font-size: .75rem; padding: .15rem .5rem; border-radius: 999px; border: 1px solid var(--border); background: #fafafa; margin-left: .35rem; }
    .badge.status-open { color: var(--warn); border-color: #f3e8ff; background: #fffbeb; }
    .badge.status-processing { color: #1d4ed8; background: #eff6ff; border-color: #dbeafe; }
    .badge.status-resolved { color: var(--ok); background: #ecfdf5; border-color: #d1fae5; }
    .badge.status-failed { color: var(--err); background: #fef2f2; border-color: #fee2e2; }
    .toolbar { display: flex; gap: .5rem; align-items: center; }
    #toast { position: fixed; right: 1rem; bottom: 1rem; z-index: 9999; padding: .75rem 1rem; border-radius: 10px; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.15); display: none; }
    #toast.ok { background: var(--ok); }
    #toast.err { background: var(--err); }
    #toast.info { background: var(--primary); }
  </style>
</head>
<body>
  <h1>Customer Support - Test UI</h1>

  <section class="card">
    <h2>Submit Ticket</h2>
    <div class="row">
      <div>
        <label>Customer Email</label>
        <input id="email" type="email" placeholder="user@example.com" />
      </div>
      <div>
        <label>Priority</label>
        <select id="priority">
          <option>low</option>
          <option selected>medium</option>
          <option>high</option>
        </select>
      </div>
    </div>
    <label>Subject</label>
    <input id="subject" placeholder="Describe the issue" />
    <label>Content</label>
    <textarea id="content" rows="4" placeholder="Details..."></textarea>
    <button id="submitBtn" class="primary">Submit</button>
    <div id="submitResult" class="muted"></div>
  </section>

  <section class="card">
    <h2>Tickets</h2>
    <div class="row">
      <div>
        <label>Filter by status</label>
        <select id="statusFilter">
          <option value="">Any</option>
          <option>open</option>
          <option>processing</option>
          <option>resolved</option>
          <option>failed</option>
        </select>
      </div>
      <div>
        <label>Search by email</label>
        <input id="emailFilter" placeholder="customer@example.com" />
      </div>
    </div>
    <div class="toolbar">
      <button id="refreshBtn">Refresh</button>
    </div>
    <div id="tickets"></div>
  </section>

  <div id="toast" class="info"></div>

  <script>
    const apiBase = window.location.origin;

    function showToast(message, kind = 'info') {
      const el = document.getElementById('toast');
      el.className = '';
      el.classList.add(kind);
      el.id = 'toast';
      el.textContent = message;
      el.style.display = 'block';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    async function submitTicket() {
      const submitBtn = document.getElementById('submitBtn');
      const emailEl = document.getElementById('email');
      const subjEl = document.getElementById('subject');
      const contentEl = document.getElementById('content');
      const priorityEl = document.getElementById('priority');
      const submitResult = document.getElementById('submitResult');

      const payload = {
        id: `ui_${Date.now()}`,
        customer_email: emailEl.value.trim(),
        subject: subjEl.value.trim(),
        content: contentEl.value.trim(),
        priority: priorityEl.value || 'medium'
      };

      if (!payload.customer_email || !payload.subject || !payload.content) {
        showToast('Please fill email, subject, and content', 'err');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Submitting...';
      submitResult.textContent = '';
      try {
        const res = await fetch(`${apiBase}/support/tickets`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        if (res.ok) {
          showToast('Ticket submitted', 'ok');
          // Reset form
          emailEl.value = '';
          subjEl.value = '';
          contentEl.value = '';
          priorityEl.value = 'medium';
        } else {
          showToast(`${res.status}: ${text}`, 'err');
        }
        refreshTickets();
      } catch (e) {
        showToast('Submission failed', 'err');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }

    async function refreshTickets() {
      const status = document.getElementById('statusFilter').value;
      const email = document.getElementById('emailFilter').value;
      const params = new URLSearchParams({ limit: '10', offset: '0' });
      if (status) params.set('status', status);
      if (email) params.set('customer_email', email);
      const res = await fetch(`${apiBase}/support/tickets?${params.toString()}`);
      const data = await res.json();
      const container = document.getElementById('tickets');
      container.innerHTML = '';
      data.forEach(t => {
        const el = document.createElement('div');
        el.className = 'card';
        const lines = [];
        const statusClass = t.status ? `badge status-${t.status}` : 'badge';
        lines.push(`<div style=\"display:flex;align-items:center;gap:.5rem;flex-wrap:wrap\">`
          + `<strong>${t.subject || '(no subject)'}</strong>`
          + `<span class=\"muted\">(${t.priority || 'medium'})</span>`
          + (t.status ? `<span class=\"${statusClass}\">${t.status}</span>` : '')
          + `</div>`);
        lines.push(`<div class=\"muted\">${t.customer_email}</div>`);
        const meta = [];
        if (t.status) meta.push(`Status: ${t.status}`);
        if (t.category) meta.push(`Category: ${t.category}`);
        if (t.sentiment) meta.push(`Sentiment: ${t.sentiment}`);
        if (t.urgency) meta.push(`Urgency: ${t.urgency}`);
        lines.push(`<div>${meta.join(' | ') || ''}</div>`);
        if (t.ai_response) {
          lines.push(`<div><strong>AI Response:</strong> <span id=\"resp_${t.id}\">${t.ai_response}</span></div>`);
          if (t.response_type) {
            lines.push(`<div class=\"muted\">Response type: ${t.response_type}</div>`);
          }
          lines.push(`<div style=\"margin-top:.5rem\">`
            + `<button data-id=\"${t.id}\" class=\"copyBtn\">Copy response</button> `
            + `<button data-id=\"${t.id}\" class=\"downloadBtn\">Download</button>`
          + `</div>`);
        }
        if (t.error_message) {
          lines.push(`<div class=\"muted\" style=\"color:#b00\"><strong>Error:</strong> ${t.error_message}</div>`);
        }
        lines.push(`<div class=\"muted\">${t.id}</div>`);
        lines.push(`<div style=\"margin-top:.5rem\">` +
          (t.status === 'failed' ? `<button data-id=\"${t.id}\" class=\"retryBtn\">Retry</button>` : '') +
        `</div>`);
        el.innerHTML = lines.join('');
        container.appendChild(el);
      });

      // Attach retry handlers
      document.querySelectorAll('.retryBtn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          const r = await fetch(`${apiBase}/support/tickets/${id}/retry`, { method: 'POST' });
          if (r.ok) refreshTickets();
        });
      });

      // Attach copy handlers
      document.querySelectorAll('.copyBtn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.getAttribute('data-id');
          const el = document.getElementById(`resp_${id}`);
          if (el) {
            try { await navigator.clipboard.writeText(el.textContent || ''); } catch {}
          }
        });
      });

      // Attach download handlers
      document.querySelectorAll('.downloadBtn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.target.getAttribute('data-id');
          const el = document.getElementById(`resp_${id}`);
          if (!el) return;
          const blob = new Blob([el.textContent || ''], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ticket_${id}_response.txt`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      });
    }

    document.getElementById('submitBtn').addEventListener('click', submitTicket);
    document.getElementById('refreshBtn').addEventListener('click', refreshTickets);
    document.getElementById('statusFilter').addEventListener('change', refreshTickets);
    document.getElementById('emailFilter').addEventListener('input', () => {
      // debounce basic
      clearTimeout(window.__filterTimer);
      window.__filterTimer = setTimeout(refreshTickets, 400);
    });
    refreshTickets();
    // Auto-refresh every 10s
    setInterval(refreshTickets, 10000);
  </script>
</body>
</html>
